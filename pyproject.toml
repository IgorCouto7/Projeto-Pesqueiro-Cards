[tool.poetry]
name = "projeto-pesqueiro"
version = "0.2.0"
description = "Sistema de gestão integrada para pesqueiro (C14)"
authors = ["Tales Henrique <retalesHMC@proton.me>"]
readme = "README.md"

# Modo pacote (exigência do professor)
package-mode = true

# Aqui dizemos explicitamente que o pacote Python é a pasta "App"
packages = [
    { include = "App" },
]

include = ["caixa.py", "caixa.html", "caixa-classico.html", "melhorias.js", "iniciar.py", "runtime_paths.py"]

[tool.poetry.dependencies]
# Compatível com Python 3.10+ (inclui 3.11 usado no CircleCI)
python = "^3.12"
fastapi = "0.141.1"
uvicorn = "0.52.4"
sqlalchemy = "^2.0.25"
pydantic = { extras = ["email"], version = "^2.6.0" }

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
httpx = "0.28.1"
ruff = "^0.2.1"
taskipy = "^1.12.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Config do pytest (já usada pelos teus testes)
[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "-p no:warnings"

# Tarefas úteis para desenvolvimento (taskipy)
[tool.taskipy.tasks]
run = "python iniciar.py"
test = "pytest -v"
lint = "ruff check ."
